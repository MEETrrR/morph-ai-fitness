<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Test</title>

<style>#ls{position:fixed;top:0;left:0;right:0;bottom:0;background:#0f0f11;color:#0f0;display:flex;align-items:center;justify-content:center;z-index:99999;font-size:1.5rem;font-family:monospace;white-space:pre-wrap;padding:2rem;}</style>

<body>
<div id="loadingScreen">Loading app-v3.js...</div>
<script>
var ls = document.getElementById('loadingScreen');
window.onerror = function(m,u,l) {
  ls.innerHTML = '<span style="color:red">ERROR line '+l+': '+m+'</span>';
  return true;
};
document.addEventListener('DOMContentLoaded', function() {
  ls.innerHTML += '\nDOM ready';
});
</script>
