<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<style>
body { margin:0; padding:1rem; background:#0f0f11; color:white; font-family:monospace; }
pre { border:1px solid #333; padding:1rem; border-radius:8px; max-height:80vh; overflow:auto; }
.error { color:#ff3b30; }
.ok { color:#30d158; }
</style>
</head><body>
<h3>Morph.AI Load Test</h3>
<pre id="log">Starting...</pre>
<script>
var log = document.getElementById('log');
function w(msg, cls) { log.innerHTML += '<span class="' + (cls||'') + '">' + msg + '</span>\n'; }

window.onerror = function(msg, url, line, col, err) {
  w('ERROR: ' + msg + ' at line ' + line + ' col ' + col, 'error');
  return true;
};

w('Loading app.js...');
var s = document.createElement('script');
s.src = '/app.js';
s.onload = function() {
  w('app.js loaded', 'ok');
  w('Waiting for DOMContentLoaded to fire...');
  // Force DOMContentLoaded  
  var evt = new Event('DOMContentLoaded');
  document.dispatchEvent(evt);
  w('DOMContentLoaded dispatched', 'ok');
  setTimeout(function() {
    var ov = document.getElementById('onboardingView');
    var mv = document.getElementById('mainAppView');
    w('onboardingView display: ' + (ov ? ov.style.display : 'null'));
    w('mainAppView display: ' + (mv ? mv.style.display : 'null'));
    w('profile: ' + (localStorage.getItem('ai_fitness_profile') ? 'exists' : 'null'));
  }, 1000);
};
s.onerror = function() { w('app.js FAILED to load', 'error'); };
document.body.appendChild(s);
</script>
</body></html>
