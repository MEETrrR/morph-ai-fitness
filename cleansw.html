<!DOCTYPE html><html><head><meta charset="UTF-8"><title>清除缓存</title></head>

<h2>🧹 清理中...</h2><p id="msg"></p>
<script>
(async()=>{
document.getElementById('msg').innerText='卸载旧SW...';
if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();}
document.getElementById('msg').innerText='清除缓存...';

})();
</script>
</body></html>
